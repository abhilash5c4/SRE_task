apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
              name: web
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/
            - name: prometheus-alerts
              mountPath: /etc/prometheus/alerts.rules
              subPath: alerts.rules
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
            # ensure the entire configMap is mounted at /etc/prometheus
        - name: prometheus-alerts
          configMap:
            name: prometheus-alerts
            # alerts.rules key will be mounted to /etc/prometheus/alerts.rules via subPath
        - name: prometheus-data
          emptyDir: {}