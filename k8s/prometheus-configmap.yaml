apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.rules

    scrape_configs:
      - job_name: 'kubernetes-nodes'
        static_configs:
          - targets: ['node-exporter:9100']

      - job_name: 'metrics-app'
        metrics_path: /metrics
        static_configs:
          - targets: ['metrics-app.monitoring-demo.svc.cluster.local:8000']